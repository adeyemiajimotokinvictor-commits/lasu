<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration <Fieldset></Fieldset>orm</title>
</head>
<link rel="stylesheet" href="stylesheet.css">
<body>
    
        <div class="city">
            <h1>STUDENT REGISTRATION FORM</h1>
                <P class="content">FILL FORM TO CREATE AN ACCOUNT</P>
            <form action="">
                <label>Full Name</label>
                <input type="text" placeholder="Your full name">

                <label >Email Address</label>
                <input type="email" placeholder="Your email address">

                <label >Phone Number</label>
                <input type="tel" placeholder="Your phone number">

                <label >Gender</label>
                <div class="gender">
                <input type="radio" name="gender" value="male" class="rent">
                <span>Male</span>
                <input type="radio" name="gender" value="female" class="tent">
                <span>Female</span>
                </div>

                <label>D.O.B</label>
                <input type="date" >
                <label >Select Course</label>
                <select class="cour">
                    <option class="cour">Choose your course</option>
                    <option class="cour">MicroBiology</option>
                    <option class="cour">Business Administration</option>
                    <option class="cour">Mass Communicatio</option>
                    <option class="cour">Biology Education</option>
                    <option class="cour">Computer Science</option>
                    <option class="cour">Medicine</option>
                </select>
                <label>Password</label>
                <input type="password" placeholder="Enter your password">
                <label > Confirm Password</label>
                <input type="password" placeholder="Confirm your password">

                <div class="red">
                    <input type="checkbox" class="orph">
                    <span>I agree to the terms and conditions</span><br>
                     <input type="checkbox" class="orph">
                    <span>I would like to receive updates and announncements via email</span>
                </div>
                 <button type="submit">Submit</button>
            </form>
        </div>
    
</body>
</html>
